<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>网盘直链下载</title>
<style>
/* Claude 品牌色系 */
:root {
  --claude-bg: #1a1a1a;
  --claude-surface: #2d2d2d;
  --claude-surface-hover: #3a3a3a;
  --claude-accent: #cc9b7a;
  --claude-accent-hover: #d4a887;
  --claude-text: #e8e3de;
  --claude-text-dim: #a39b93;
  --claude-success: #73c991;
  --claude-warning: #e5a85a;
  --claude-error: #e57373;
  --claude-border: #404040;
  --claude-shadow: rgba(0,0,0,0.3);
}

* {
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body {
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  background:var(--claude-bg);
  color:var(--claude-text);
  line-height:1.6;
  padding:16px;
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
}

/* 标题 - Claude 风格 */
.header {
  text-align:center;
  margin-bottom:24px;
  padding-bottom:20px;
  border-bottom:1px solid var(--claude-border);
}

.header h1 {
  font-size:24px;
  font-weight:600;
  color:var(--claude-accent);
  margin-bottom:4px;
  letter-spacing:-0.02em;
}

.header .version {
  font-size:12px;
  color:var(--claude-text-dim);
  font-weight:400;
}

/* 卡片容器 */
.card {
  background:var(--claude-surface);
  border:1px solid var(--claude-border);
  border-radius:12px;
  padding:16px;
  margin-bottom:16px;
  box-shadow:0 2px 8px var(--claude-shadow);
}

.card-title {
  font-size:14px;
  font-weight:600;
  color:var(--claude-accent);
  margin-bottom:12px;
  display:flex;
  align-items:center;
  gap:8px;
}

/* 账号状态行 */
.account-row {
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:12px 0;
  border-bottom:1px solid var(--claude-border);
}

.account-row:last-child {
  border-bottom:none;
  padding-bottom:0;
}

.account-info {
  flex:1;
}

.account-name {
  font-size:15px;
  font-weight:500;
  color:var(--claude-text);
  margin-bottom:2px;
}

.account-host {
  font-size:12px;
  color:var(--claude-text-dim);
}

.account-actions {
  display:flex;
  align-items:center;
  gap:8px;
}

/* 状态徽章 */
.badge {
  padding:4px 10px;
  border-radius:12px;
  font-size:11px;
  font-weight:500;
  letter-spacing:0.02em;
}

.badge.on {
  background:rgba(115,201,145,0.15);
  color:var(--claude-success);
  border:1px solid var(--claude-success);
}

.badge.off {
  background:rgba(163,155,147,0.15);
  color:var(--claude-text-dim);
  border:1px solid var(--claude-border);
}

/* 按钮 - Claude 风格触摸友好 */
button {
  font-family:inherit;
  font-size:13px;
  font-weight:500;
  padding:8px 16px;
  border:1px solid var(--claude-accent);
  border-radius:8px;
  background:var(--claude-accent);
  color:#1a1a1a;
  cursor:pointer;
  transition:all 0.2s ease;
  min-height:44px; /* iOS 触摸目标最小尺寸 */
  -webkit-appearance:none;
  user-select:none;
}

button:active {
  transform:scale(0.97);
  background:var(--claude-accent-hover);
}

button.secondary {
  background:transparent;
  color:var(--claude-accent);
}

button.secondary:active {
  background:rgba(204,155,122,0.1);
}

button.small {
  font-size:12px;
  padding:6px 12px;
  min-height:36px;
}

button:disabled {
  opacity:0.5;
  cursor:not-allowed;
  transform:none !important;
}

/* 输入框 */
.input-group {
  margin-bottom:12px;
}

.input-group label {
  display:block;
  font-size:13px;
  font-weight:500;
  color:var(--claude-text-dim);
  margin-bottom:6px;
}

input[type="text"],
input[type="password"],
textarea {
  width:100%;
  padding:12px;
  font-size:15px;
  font-family:inherit;
  background:var(--claude-bg);
  border:1px solid var(--claude-border);
  border-radius:8px;
  color:var(--claude-text);
  transition:border-color 0.2s ease;
  -webkit-appearance:none;
  min-height:44px;
}

input:focus,
textarea:focus {
  outline:none;
  border-color:var(--claude-accent);
  background:rgba(204,155,122,0.05);
}

textarea {
  resize:vertical;
  min-height:88px;
  line-height:1.5;
}

/* 进度条 - Claude 品牌色 */
.progress-container {
  margin:16px 0;
}

.progress-bar {
  width:100%;
  height:8px;
  background:rgba(163,155,147,0.2);
  border-radius:4px;
  overflow:hidden;
}

.progress-fill {
  height:100%;
  background:linear-gradient(90deg,var(--claude-accent) 0%,var(--claude-accent-hover) 100%);
  width:0%;
  transition:width 0.3s ease;
  box-shadow:0 0 12px rgba(204,155,122,0.4);
}

.progress-text {
  font-size:13px;
  color:var(--claude-text-dim);
  text-align:center;
  margin-top:8px;
}

/* 日志区域 */
.log-container {
  background:var(--claude-bg);
  border:1px solid var(--claude-border);
  border-radius:8px;
  padding:12px;
  max-height:200px;
  overflow-y:auto;
  font-family:'SF Mono',Monaco,Consolas,'Courier New',monospace;
  font-size:12px;
  line-height:1.6;
  color:var(--claude-text-dim);
}

.log-container::-webkit-scrollbar {
  width:6px;
}

.log-container::-webkit-scrollbar-track {
  background:transparent;
}

.log-container::-webkit-scrollbar-thumb {
  background:var(--claude-border);
  border-radius:3px;
}

.log-line {
  margin-bottom:4px;
  word-break:break-all;
}

/* 提示卡片 */
.info-card {
  background:rgba(204,155,122,0.1);
  border:1px solid var(--claude-accent);
  border-radius:8px;
  padding:12px;
  font-size:13px;
  color:var(--claude-text-dim);
  line-height:1.5;
}

.info-card strong {
  color:var(--claude-accent);
}

/* 续传提示 */
.resume-hint {
  background:rgba(115,201,145,0.1);
  border:1px solid var(--claude-success);
  border-left:3px solid var(--claude-success);
  border-radius:8px;
  padding:12px;
  font-size:13px;
  color:var(--claude-text);
  margin-top:12px;
}

.resume-hint .filename {
  font-weight:500;
  color:var(--claude-success);
  word-break:break-all;
}

/* 工具栏 */
.toolbar {
  display:flex;
  gap:8px;
  justify-content:space-between;
}

.toolbar button {
  flex:1;
}

/* 响应式 */
@media (max-width:360px) {
  body {
    padding:12px;
  }

  .card {
    padding:12px;
  }

  button {
    font-size:12px;
    padding:6px 12px;
  }
}

/* 深色模式增强 */
@media (prefers-color-scheme:dark) {
  body {
    background:var(--claude-bg);
  }
}
</style>
</head>
<body>

<div class="header">
  <h1>网盘直链下载</h1>
  <div class="version">v0.39 Claude Edition</div>
</div>

<!-- 账号管理 -->
<div class="card">
  <div class="card-title">📱 账号状态</div>

  <div class="account-row">
    <div class="account-info">
      <div class="account-name">夸克网盘</div>
      <div class="account-host">pan.quark.cn</div>
    </div>
    <div class="account-actions">
      <span class="badge off" id="qBadge">未登录</span>
      <button class="small secondary" id="qLogin">登录</button>
    </div>
  </div>

  <div class="account-row">
    <div class="account-info">
      <div class="account-name">UC网盘</div>
      <div class="account-host">drive.uc.cn</div>
    </div>
    <div class="account-actions">
      <span class="badge off" id="uBadge">未登录</span>
      <button class="small secondary" id="uLogin">登录</button>
    </div>
  </div>

  <div class="account-row">
    <div class="account-info">
      <div class="account-name">123网盘</div>
      <div class="account-host">123pan.com</div>
    </div>
    <div class="account-actions">
      <span class="badge off" id="pBadge">未登录</span>
      <button class="small secondary" id="pLogin">登录</button>
    </div>
  </div>

  <div class="account-row">
    <div class="account-info">
      <div class="account-name">百度网盘</div>
      <div class="account-host">pan.baidu.com</div>
    </div>
    <div class="account-actions">
      <span class="badge off" id="bBadge">未登录</span>
      <button class="small secondary" id="bLogin">登录</button>
    </div>
  </div>

  <div class="account-row">
    <div class="account-info">
      <div class="account-name">迅雷</div>
      <div class="account-host">pan.xunlei.com</div>
    </div>
    <div class="account-actions">
      <span class="badge off" id="xBadge">未登录</span>
      <button class="small secondary" id="xLogin">登录</button>
    </div>
  </div>
</div>

<!-- 下载任务 -->
<div class="card">
  <div class="card-title">⬇️ 下载任务</div>

  <div class="input-group">
    <label>网盘分享链接</label>
    <input type="text" id="url" placeholder="粘贴网盘分享链接...">
  </div>

  <div class="input-group">
    <label>提取码 (如需要)</label>
    <input type="text" id="pwd" placeholder="输入提取码...">
  </div>

  <div class="toolbar">
    <button id="startBtn">开始下载</button>
    <button class="secondary" id="cancelBtn">取消</button>
  </div>

  <div class="progress-container" id="progressContainer" style="display:none">
    <div class="progress-bar">
      <div class="progress-fill" id="progressFill"></div>
    </div>
    <div class="progress-text" id="progressText">准备中...</div>
  </div>

  <div id="resumeHint" style="display:none" class="resume-hint">
    💾 上次未完成: <span class="filename" id="resumeFile"></span><br>
    进度: <span id="resumeProgress"></span> · <button class="small secondary" id="continueBtn">继续下载</button>
  </div>
</div>

<!-- 日志 -->
<div class="card">
  <div class="card-title">📋 运行日志</div>
  <div class="log-container" id="log"></div>
</div>

<!-- 使用提示 -->
<div class="info-card">
  <strong>💡 使用提示</strong><br>
  • 支持夸克/UC/123/百度/迅雷网盘<br>
  • 文件保存到 /Download/DSH-Go/<br>
  • 支持断点续传,应用保活<br>
  • Claude Edition - Powered by Anthropic
</div>

<script>
// JavaScript 保持原有逻辑,只更新 UI 交互部分
// (这里只是 UI 框架,实际 JS 需要连接原有的 Android WebView 接口)

// 示例:更新状态徽章
function updateBadge(id, isLoggedIn) {
  const badge = document.getElementById(id);
  if (isLoggedIn) {
    badge.className = 'badge on';
    badge.textContent = '已登录';
  } else {
    badge.className = 'badge off';
    badge.textContent = '未登录';
  }
}

// 示例:更新进度
function updateProgress(percent, text) {
  document.getElementById('progressContainer').style.display = 'block';
  document.getElementById('progressFill').style.width = percent + '%';
  document.getElementById('progressText').textContent = text;
}

// 示例:添加日志
function addLog(message) {
  const logDiv = document.getElementById('log');
  const line = document.createElement('div');
  line.className = 'log-line';
  line.textContent = new Date().toLocaleTimeString() + ' ' + message;
  logDiv.appendChild(line);
  logDiv.scrollTop = logDiv.scrollHeight;
}

// 初始化
document.addEventListener('DOMContentLoaded', function() {
  addLog('应用启动完成');
  addLog('Claude Edition v0.39');

  // 绑定按钮事件 (需要连接到 Android 接口)
  document.getElementById('startBtn').addEventListener('click', function() {
    const url = document.getElementById('url').value;
    const pwd = document.getElementById('pwd').value;
    if (!url) {
      alert('请输入网盘链接');
      return;
    }
    addLog('开始解析链接...');
    // 调用 Android.startDownload(url, pwd)
  });

  document.getElementById('cancelBtn').addEventListener('click', function() {
    addLog('用户取消下载');
    // 调用 Android.cancel()
  });
});
</script>

</body>
</html>
