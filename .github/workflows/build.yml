name: Build APK

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up JDK 8
      uses: actions/setup-java@v3
      with:
        java-version: '8'
        distribution: 'temurin'

    - name: Download Android Build Tools
      run: |
        cd tools
        wget -q https://dl.google.com/android/repository/build-tools_r30.0.3-linux.zip
        unzip -q build-tools_r30.0.3-linux.zip
        wget -q https://dl.google.com/android/repository/platform-28_r06.zip
        unzip -q platform-28_r06.zip

    - name: Build APK
      run: |
        cd source
        chmod +x ../tools/build.sh
        bash ../tools/build.sh

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: qdl-baidu-fix
        path: source/bin/*.apk
